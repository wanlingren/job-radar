name: job-radar-sync

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Shanghai"

    - cron: "0 18 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:

permissions:
  contents: write

env:
  WORKBENCH_URL: https://wanlingren.github.io/job-radar/

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Quick verified source discovery
        run: python3 scripts/discover_sources.py --max-pages 45

      - name: Run daily fast sync
        run: python3 scripts/sync_plan.py fast

      - name: Build one WeCom summary
        run: python3 scripts/notify_preview.py

      - name: Send one WeCom summary
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python3 scripts/send_notify.py

      - name: Quick source health check
        run: python3 scripts/source_health.py --limit 80

      - name: Commit data and source audit
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/ config/discovered_sources.csv config/discovered_universities.csv config/coverage_report.csv config/university_coverage.csv config/coverage_summary.md || true
          git diff --cached --quiet || git commit -m "chore(data): daily V2.1 regional job sync"
          git push
