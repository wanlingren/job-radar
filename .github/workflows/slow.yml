name: job-radar-slow

on:
  schedule:
    - cron: "20 5 * * 3,0"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

env:
  WORKBENCH_URL: https://wanlingren.github.io/job-radar/

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Full city/county source discovery
        run: python3 scripts/discover_sources.py --full --max-pages 120

      - name: Run slow sources
        run: python3 scripts/sync_plan.py slow

      - name: Commit slow-scan data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/ config/discovered_sources.csv || true
          git diff --cached --quiet || git commit -m "chore(data): weekly county source refresh"
          git push
