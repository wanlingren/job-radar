name: job-radar-slow

on:
  schedule:
    - cron: "20 5 * * 3,0"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

env:
  WORKBENCH_URL: https://wanlingren.github.io/job-radar/

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Full verified city county source discovery
        run: python3 scripts/discover_sources.py --full --max-pages 180

      - name: Run slow sources
        run: python3 scripts/sync_plan.py slow

      - name: Build one WeCom summary after slow scan
        run: python3 scripts/notify_preview.py

      - name: Send one WeCom summary after slow scan
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python3 scripts/send_notify.py

      - name: Full source health check
        run: python3 scripts/source_health.py

      - name: Commit slow scan data and coverage audit
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/ config/discovered_sources.csv config/discovered_universities.csv config/coverage_report.csv config/university_coverage.csv config/coverage_summary.md || true
          git diff --cached --quiet || git commit -m "chore(data): weekly V2.1 county source refresh"
          git push
